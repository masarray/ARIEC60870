version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "nuget"
    directories:
      - "/src/ARIEC60870.Master"
      - "/tests/ARIEC60870.Core.Tests"
      - "/tests/ARIEC60870.Master.Tests"
      - "/tests/ARIEC60870.Reporting.Tests"
      - "/tests/ARIEC60870.Desktop.Tests"
      - "/tests/ARIEC60870.Repository.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    groups:
      dotnet-test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit"
          - "xunit.runner.visualstudio"
          - "coverlet.collector"
        update-types:
          - "minor"
          - "patch"
      dotnet-runtime-packages:
        patterns:
          - "System.*"
          - "Microsoft.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "dotnet"
    commit-message:
      prefix: "deps"
      include: "scope"
