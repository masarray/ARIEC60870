name: OpenSSF Scorecard

on:
  # Repository posture does not need a new scan after every source or docs commit.
  # Weekly coverage stays unconditional; security-configuration changes scan immediately.
  push:
    branches: [ main, master ]
    paths:
      - '.github/**'
      - 'SECURITY.md'
      - '.gitattributes'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Analyze repository security posture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
