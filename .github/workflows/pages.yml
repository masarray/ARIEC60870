name: Deploy GitHub Pages site

on:
  push:
    branches: [ main, master ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical site files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f site/site.webmanifest
          test -f site/seo-manifest.json
          test -f site/llms.txt
          test -f site/humans.txt
          if [ -f landing/index.html ] || [ -f docs/index.html ]; then
            echo "Only site/ may contain the public GitHub Pages HTML source."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
