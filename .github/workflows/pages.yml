name: Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical site files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f site/site.webmanifest
          test -f site/seo-manifest.json
          test -f site/llms.txt
          test -f site/humans.txt
          if [ -f landing/index.html ]; then
            echo "Legacy landing/ source is not allowed. Use site/ as canonical source."
            exit 1
          fi
          if [ ! -f docs/index.html ] || [ ! -f docs/.pages-compatibility-mirror ]; then
            echo "::notice::docs/ compatibility mirror is missing. GitHub Actions Pages still deploys from site/."
          elif ! cmp -s site/index.html docs/index.html; then
            echo "::warning::docs/index.html is out of sync with site/index.html. Run scripts/sync-github-pages-docs-mirror.ps1 after landing edits."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
