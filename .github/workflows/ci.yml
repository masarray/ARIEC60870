name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare pinned Inter font
        shell: pwsh
        run: ./scripts/prepare-inter-font.ps1

      - name: Restore
        run: dotnet restore ARIEC60870.sln

      - name: Build with release warning gate
        run: dotnet build ARIEC60870.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Check code formatting
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet format ARIEC60870.sln --verify-no-changes --verbosity minimal

      - name: Run dependency-free protocol smoke tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          dotnet run --project tests/ARIEC60870.Protocol.Tests/ARIEC60870.Protocol.Tests.csproj --configuration Release --no-build 2>&1 | Tee-Object -FilePath artifacts/test-results/protocol-smoke-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Protocol smoke tests failed with exit code $LASTEXITCODE." }

      - name: Run xUnit regression suites with TRX and coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          $projects = @(
            'tests/ARIEC60870.Core.Tests/ARIEC60870.Core.Tests.csproj',
            'tests/ARIEC60870.Master.Tests/ARIEC60870.Master.Tests.csproj',
            'tests/ARIEC60870.Monitor.Tests/ARIEC60870.Monitor.Tests.csproj',
            'tests/ARIEC60870.Reporting.Tests/ARIEC60870.Reporting.Tests.csproj',
            'tests/ARIEC60870.Desktop.Tests/ARIEC60870.Desktop.Tests.csproj',
            'tests/ARIEC60870.Repository.Tests/ARIEC60870.Repository.Tests.csproj'
          )

          foreach ($project in $projects) {
            $name = Split-Path (Split-Path $project -Parent) -Leaf
            dotnet test $project `
              --configuration Release `
              --no-build `
              --logger "trx;LogFileName=$name.trx" `
              --results-directory artifacts/test-results `
              --collect "XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) { throw "Regression suite $project failed with exit code $LASTEXITCODE." }
          }

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Package ARIEC60870 GUI with integrated Passive Monitor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = 'artifacts/passive-gui-publish'
          $package = 'artifacts/passive-gui-package'
          dotnet publish src/ARIEC60870.Desktop/ARIEC60870.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Desktop GUI publish failed.' }
          $exe = Join-Path $publish 'ARIEC60870.Desktop.exe'
          if (!(Test-Path $exe)) { throw 'Expected GUI executable missing.' }
          # Instantiate actual WPF window and its resource dictionaries without opening any COM.
          & $exe --passive-gui-smoke
          if ($LASTEXITCODE -ne 0) { throw "Passive GUI smoke failed with exit code $LASTEXITCODE." }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $zip = Join-Path $package 'ARIEC60870-Passive-Monitor-P0-GUI-win-x64.zip'
          # Package the current live-first operator workflow, not the retired record-first P0 guide.
          Copy-Item 'docs/IEC101_LIVE_MONITOR_SELECTIVE_CAPTURE_20261029.md' (Join-Path $publish 'START_HERE_MONITOR.md') -Force
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $package 'SHA256SUMS.txt') -Value "$hash  ARIEC60870-Passive-Monitor-P0-GUI-win-x64.zip" -Encoding ascii

      - name: Upload integrated P0 Windows GUI test package
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-Passive-Monitor-P0-GUI-win-x64
          path: artifacts/passive-gui-package/
          if-no-files-found: error
          retention-days: 14
