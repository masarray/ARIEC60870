name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Full evidence or installer-upgrade FAT'
        type: choice
        options: [full, installer]
        required: true
        default: full
      expected_sha:
        description: 'Optional exact PR head; reject stale branch'
        type: string
        required: false
        default: ''
      requested_pr:
        description: 'Optional PR number for head verification'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

# Cancel superseded PR commits, never cancel master validation/release evidence.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Select required CI work
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_windows: ${{ steps.scope.outputs.run_windows }}
    steps:
      - name: Classify changes and verify requested SHA
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let runWindows = true;
            const onlyMarkdown = files => files.length > 0 && files.length < 300 &&
              files.every(f => /\.(md|mdx)$/i.test(f.filename) &&
                (!f.previous_filename || /\.(md|mdx)$/i.test(f.previous_filename)));
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: context.payload.pull_request.number, per_page: 100
              });
              runWindows = !onlyMarkdown(files);
            } else if (context.eventName === 'push') {
              const before = context.payload.before || '';
              if (/^[0-9a-f]{40}$/i.test(before) && !/^0+$/.test(before)) {
                try {
                  const { data } = await github.rest.repos.compareCommits({
                    owner, repo, base: before, head: context.sha
                  });
                  runWindows = !onlyMarkdown(data.files || []);
                } catch (error) {
                  core.warning('Push comparison unavailable; using full test: ' + error.message);
                }
              }
            }
            if (context.eventName === 'workflow_dispatch') {
              const expected = (context.payload.inputs?.expected_sha || '').trim();
              const prText = (context.payload.inputs?.requested_pr || '').trim();
              if (expected && (!/^[0-9a-f]{40}$/i.test(expected) ||
                  context.sha.toLowerCase() !== expected.toLowerCase())) {
                core.setFailed('Stale dispatch: expected ' + expected + ' but got ' + context.sha);
                return;
              }
              if (prText) {
                const number = Number(prText);
                if (!expected || !Number.isSafeInteger(number) || number < 1) {
                  core.setFailed('PR-bound dispatch requires valid PR number and exact SHA');
                  return;
                }
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (pr.state !== 'open' || pr.head.sha.toLowerCase() !== expected.toLowerCase() ||
                    pr.head.repo?.full_name.toLowerCase() !== (owner + '/' + repo).toLowerCase()) {
                  core.setFailed('The requested PR head changed or is no longer open/same-repo');
                  return;
                }
              }
            }
            core.setOutput('run_windows', String(runWindows));
            core.notice(runWindows ? 'Windows tests required' : 'Markdown-only; no Windows runner');

  build-test:
    needs: classify
    # Preserve the historic required check context `build-test` for branch rules.
    runs-on: ${{ needs.classify.outputs.run_windows == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      RUN_PACKAGES: ${{ needs.classify.outputs.run_windows == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'ci/')) }}
      RUN_INSTALLER: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'installer' }}
      COLLECT_COVERAGE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Markdown-only change
        if: needs.classify.outputs.run_windows == 'false'
        run: echo "Markdown-only; build-test check preserved without launching Windows."
      - name: Checkout
        if: needs.classify.outputs.run_windows == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET
        if: needs.classify.outputs.run_windows == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare pinned Inter font
        if: needs.classify.outputs.run_windows == 'true'
        shell: pwsh
        run: ./scripts/prepare-inter-font.ps1

      - name: Cache NuGet packages
        if: needs.classify.outputs.run_windows == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', '**/packages.lock.json', 'global.json', 'NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        if: needs.classify.outputs.run_windows == 'true'
        run: dotnet restore ARIEC60870.sln

      - name: Build with release warning gate
        if: needs.classify.outputs.run_windows == 'true'
        run: dotnet build ARIEC60870.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Check code formatting
        if: needs.classify.outputs.run_windows == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet format ARIEC60870.sln --verify-no-changes --verbosity minimal

      - name: Run dependency-free protocol smoke tests
        if: needs.classify.outputs.run_windows == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          dotnet run --project tests/ARIEC60870.Protocol.Tests/ARIEC60870.Protocol.Tests.csproj --configuration Release --no-build 2>&1 | Tee-Object -FilePath artifacts/test-results/protocol-smoke-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Protocol smoke tests failed with exit code $LASTEXITCODE." }

      - name: Run xUnit regression suites with TRX and coverage
        if: needs.classify.outputs.run_windows == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          $projects = @(
            'tests/ARIEC60870.Core.Tests/ARIEC60870.Core.Tests.csproj',
            'tests/ARIEC60870.Master.Tests/ARIEC60870.Master.Tests.csproj',
            'tests/ARIEC60870.Monitor.Tests/ARIEC60870.Monitor.Tests.csproj',
            'tests/ARIEC60870.Reporting.Tests/ARIEC60870.Reporting.Tests.csproj',
            'tests/ARIEC60870.Desktop.Tests/ARIEC60870.Desktop.Tests.csproj',
            'tests/ARIEC60870.Repository.Tests/ARIEC60870.Repository.Tests.csproj'
          )

          $coverage = @()
          if ($env:COLLECT_COVERAGE -eq 'true') {
            $coverage = @('--collect', 'XPlat Code Coverage')
          }
          foreach ($project in $projects) {
            $name = Split-Path (Split-Path $project -Parent) -Leaf
            dotnet test $project `
              --configuration Release `
              --no-build `
              --logger "trx;LogFileName=$name.trx" `
              --results-directory artifacts/test-results `
              @coverage
            if ($LASTEXITCODE -ne 0) { throw "Regression suite $project failed with exit code $LASTEXITCODE." }
          }

      - name: Upload test and coverage artifacts
        if: always() && needs.classify.outputs.run_windows == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Package ARIEC60870 GUI with integrated Passive Monitor
        if: env.RUN_PACKAGES == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = 'artifacts/passive-gui-publish'
          $package = 'artifacts/passive-gui-package'
          dotnet publish src/ARIEC60870.Desktop/ARIEC60870.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Desktop GUI publish failed.' }
          $exe = Join-Path $publish 'ARIEC60870.Desktop.exe'
          if (!(Test-Path $exe)) { throw 'Expected GUI executable missing.' }
          # Instantiate actual WPF window and its resource dictionaries without opening any COM.
          $smoke = Start-Process -FilePath $exe -ArgumentList '--passive-gui-smoke' -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) { throw "Passive GUI smoke failed with process exit code $($smoke.ExitCode)." }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $zip = Join-Path $package 'ARIEC60870-Passive-Monitor-P0-GUI-win-x64.zip'
          # Package the current live-first operator workflow, not the retired record-first P0 guide.
          Copy-Item 'docs/IEC101_LIVE_MONITOR_SELECTIVE_CAPTURE_20261029.md' (Join-Path $publish 'START_HERE_MONITOR.md') -Force
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $package 'SHA256SUMS.txt') -Value "$hash  ARIEC60870-Passive-Monitor-P0-GUI-win-x64.zip" -Encoding ascii

      - name: Package independent IEC-101 2/4-RX field test tools
        if: env.RUN_PACKAGES == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = 'artifacts/field-tools-publish'
          $package = 'artifacts/field-tools-package'
          dotnet publish src/ARIEC60870.Monitor.Cli/ARIEC60870.Monitor.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Field tools publish failed.' }
          $exe = Join-Path $publish 'ARIEC60870.Monitor.Cli.exe'
          if (!(Test-Path $exe)) { throw 'Field CLI EXE missing.' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Field CLI help failed.' }
          & $exe list-ports
          if ($LASTEXITCODE -ne 0) { throw 'Field CLI inventory failed.' }
          # Fail-closed preflight, no hardware opened; deliberate absent COM pair.
          $missingPortArgs = @('preflight', '--scada-com', 'COM601', '--rtu-com', 'COM602', '--output', $env:RUNNER_TEMP, '--seconds', '2')
          $missingPortProbe = Start-Process -FilePath $exe -ArgumentList $missingPortArgs -Wait -PassThru -NoNewWindow
          if ($missingPortProbe.ExitCode -ne 3) { throw "Absent COM preflight must fail closed with exit 3; got $($missingPortProbe.ExitCode)." }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'docs/IEC101_FIELD_RX_FAT_QUICKSTART.md' (Join-Path $publish 'START_HERE_FIELD_FAT.md') -Force
          Copy-Item 'LICENSE' (Join-Path $publish 'LICENSE') -Force
          Copy-Item 'NOTICE' (Join-Path $publish 'NOTICE') -Force
          $zip = Join-Path $package 'ARIEC60870-IEC101-RX-Field-Tools-win-x64.zip'
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $package 'SHA256SUMS.txt') -Value "$hash  ARIEC60870-IEC101-RX-Field-Tools-win-x64.zip" -Encoding ascii

      - name: Upload independent field test toolkit
        if: env.RUN_PACKAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-IEC101-RX-Field-Tools-win-x64
          path: artifacts/field-tools-package/
          if-no-files-found: error
          retention-days: 14

      - name: OBS-C real-WPF viewport and 1400-frame acceptance
        if: env.RUN_PACKAGES == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'artifacts/passive-gui-publish/ARIEC60870.Desktop.exe'
          $output = 'artifacts/obs-c-ui-evidence'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $accept = Start-Process -FilePath $exe -ArgumentList @('--observation-ui-acceptance', '--observation-out', $output) -Wait -PassThru -NoNewWindow
          if ($accept.ExitCode -ne 0) {
            if (Test-Path (Join-Path $output 'failure.txt')) { Get-Content (Join-Path $output 'failure.txt') }
            throw "OBS-C WPF acceptance failed with process exit code $($accept.ExitCode)."
          }
          if (!(Test-Path (Join-Path $output 'metrics.json'))) { throw 'Missing measured GUI acceptance evidence.' }
          if ((Get-ChildItem $output -Filter *.png).Count -lt 7) { throw 'Missing real-WPF viewport screenshots.' }

      - name: Upload OBS-C Windows WPF screenshots and metrics
        if: always() && env.RUN_PACKAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-OBS-C-ui-evidence
          path: artifacts/obs-c-ui-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload integrated P0 Windows GUI test package
        if: env.RUN_PACKAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-Passive-Monitor-P0-GUI-win-x64
          path: artifacts/passive-gui-package/
          if-no-files-found: error
          retention-days: 14

      # Exact GUI binary is staged only for the explicitly requested installer gate.
      - name: Stage tested GUI binary for isolated installer validation
        if: env.RUN_INSTALLER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-installer-input
          path: artifacts/passive-gui-publish/
          if-no-files-found: error
          retention-days: 3

  # Installer upgrade/restart-manager acceptance is deliberately NOT in the
  # first job: an external installer hang must never delay tests/screenshots.
  # Only /ci installer or explicit installer dispatch runs this expensive gate.
  installer-upgrade:
    name: Bounded previous-release upgrade and running-Master shutdown
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'installer'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout installer scripts
        uses: actions/checkout@v4

      - name: Download exact tested GUI publish from current run
        uses: actions/download-artifact@v4
        with:
          name: ARIEC60870-installer-input
          path: artifacts/passive-gui-publish/

      - name: Compile the tested Windows Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Unable to acquire Inno Setup compiler.' }
          }
          if (!(Test-Path $iscc)) { throw "Missing Inno Setup compiler: $iscc" }
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ([version]$version -le [version]'3.6.7') { throw 'This upgrade acceptance requires a version newer than v3.6.7.' }
          New-Item -ItemType Directory -Force -Path artifacts/installer | Out-Null
          $source = (Resolve-Path artifacts/passive-gui-publish).Path
          $output = (Resolve-Path artifacts/installer).Path
          & $iscc "/DAppVersion=$version" "/DSourceRoot=$source" "/DOutputRoot=$output" installer/ARIEC60870.iss
          if ($LASTEXITCODE -ne 0) { throw 'Current-version Inno compilation failed.' }
          $setup = Join-Path $output "ARIEC60870-v$version-setup-win-x64.exe"
          if (!(Test-Path $setup)) { throw 'Current installer artifact missing.' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content (Join-Path $output 'SHA256SUMS.txt') "$hash  $(Split-Path $setup -Leaf)" -Encoding ascii
          # Publishable only as a TEST installer until upgrade validation is green.
          # Preserve the exact compiled installer independently of the long FAT.
          New-Item -ItemType Directory -Force -Path artifacts/installer-deliverable | Out-Null
          Copy-Item $setup artifacts/installer-deliverable/ -Force
          Copy-Item (Join-Path $output 'SHA256SUMS.txt') artifacts/installer-deliverable/ -Force

      - name: Upload compiled installer before upgrade validation
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-InnoSetup-win-x64
          path: artifacts/installer-deliverable/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify previous release upgrade and active Master shutdown
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          # Tests are intentionally separate from artifact publication. Each process
          # is bounded; a failed/hung upgrade cannot suppress a compiled test setup.
          # Do not allow silent installers/upgrades to wait indefinitely on a
          # WPF process, Windows Restart Manager, or an invisible UI dialog.
          function Invoke-BoundedProcess {
            param([string]$Path, [string[]]$Arguments, [int]$Seconds = 180)
            $child = Start-Process -FilePath $Path -ArgumentList $Arguments -PassThru
            if (!$child.WaitForExit($Seconds * 1000)) {
              try { $child.Kill($true) } catch { }
              throw "Timed out after $Seconds seconds: $Path"
            }
            return [pscustomobject]@{ ExitCode = $child.ExitCode }
          }
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $oldVersion = '3.6.7'
          $output = (Resolve-Path artifacts/installer).Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Missing Inno Setup compiler: $iscc" }
          $oldSource = Join-Path $env:RUNNER_TEMP 'ariec-old-release'
          New-Item -ItemType Directory -Force -Path $oldSource | Out-Null
          $oldZip = Join-Path $env:RUNNER_TEMP 'ARIEC60870-previous.zip'
          $baseUrl = "https://github.com/masarray/ARIEC60870/releases/download/v$oldVersion"
          curl.exe -fLsS --retry 3 --retry-delay 2 --max-time 180 -o $oldZip "$baseUrl/ARIEC60870-v$oldVersion-win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download canonical previous release.' }
          $sumFile = Join-Path $env:RUNNER_TEMP 'ARIEC60870-previous-sums.txt'
          curl.exe -fLsS --retry 3 --retry-delay 2 --max-time 30 -o $sumFile "$baseUrl/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download canonical previous checksums.' }
          $expected = Get-Content $sumFile | Where-Object { $_ -match 'ARIEC60870-v3\.6\.7-win-x64\.zip$' } | Select-Object -First 1
          if (!$expected) { throw 'Previous release ZIP is absent from published SHA256SUMS.' }
          $digest = ([regex]::Match($expected, '^[0-9a-fA-F]{64}')).Value
          if (!(($digest) -and ((Get-FileHash $oldZip -Algorithm SHA256).Hash -ieq $digest))) {
            throw 'Previous release ZIP checksum mismatch.'
          }
          Expand-Archive -Path $oldZip -DestinationPath $oldSource -Force
          if (!(Test-Path (Join-Path $oldSource 'ARIEC60870.exe'))) {
            throw 'Old public release does not contain the expected application EXE.'
          }
          & $iscc "/DAppVersion=$oldVersion" "/DSourceRoot=$oldSource" "/DSourceExe=ARIEC60870.exe" "/DOutputRoot=$output" installer/ARIEC60870.iss
          if ($LASTEXITCODE -ne 0) { throw 'Previous-version installer compilation failed.' }
          $oldSetup = Join-Path $output "ARIEC60870-v$oldVersion-setup-win-x64.exe"
          $setup = Join-Path $output "ARIEC60870-v$version-setup-win-x64.exe"
          if (!(Test-Path $oldSetup) -or !(Test-Path $setup)) {
            throw 'Compiled old/current setups missing before upgrade acceptance.'
          }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/ARIEC60870'
          $exe = Join-Path $installDir 'ARIEC60870.exe'
          $userData = Join-Path $env:LOCALAPPDATA 'ARIEC60870'
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          $sentinel = Join-Path $userData 'ci-install-preservation.txt'
          'preserve' | Set-Content $sentinel
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NORESTARTAPPLICATIONS')
          $oldInstall = Invoke-BoundedProcess -Path $oldSetup -Arguments $args -Seconds 180
          if ($oldInstall.ExitCode -ne 0 -or !(Test-Path $exe)) { throw 'Previous release installation failed.' }
          if ((Get-Item $exe).VersionInfo.FileVersion -notlike '3.6.7*') { throw 'Not actually running previous 3.6.7 binary.' }
          # Genuine published-old-binary -> newest-version update while the
          # previously installed WPF application is open.
          $oldProcess = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 2
          if ($oldProcess.HasExited) { throw 'Old WPF application did not remain open.' }
          $upgrade = Invoke-BoundedProcess -Path $setup -Arguments $args -Seconds 180
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade from v$oldVersion failed: $($upgrade.ExitCode)" }
          if (!$oldProcess.WaitForExit(20000)) { throw 'Inno did not close the running previous application.' }
          if (!(Test-Path $exe) -or !(Test-Path $sentinel)) { throw 'Upgrade lost installed executable or user data.' }
          if ((Get-Item $exe).VersionInfo.FileVersion -notlike "$version*") { throw 'In-place upgrade retained old executable version.' }
          $registry = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Where-Object { (Get-ItemProperty $_.PsPath -ErrorAction SilentlyContinue).DisplayName -eq 'ARIEC60870 Evidence Analyzer' })
          if ($registry.Count -ne 1) { throw "Expected one uninstall registration, found $($registry.Count)." }
          $installedVersion = (Get-ItemProperty $registry[0].PsPath).DisplayVersion
          if ($installedVersion -ne $version) { throw "Registry kept stale version $installedVersion." }
          $smoke = Invoke-BoundedProcess -Path $exe -Arguments @('--passive-gui-smoke') -Seconds 90
          if ($smoke.ExitCode -ne 0) { throw "Installed WPF smoke failed: $($smoke.ExitCode)" }
          # New version: verified active Master *simulation* must finalize before
          # Restart Manager can close the app; no field COM/TCP touched.
          $readyFile = Join-Path $env:RUNNER_TEMP 'active-master-ready.txt'
          Remove-Item $readyFile -ErrorAction SilentlyContinue
          $live = Start-Process -FilePath $exe -ArgumentList @('--installer-master-close-smoke','--ready-file',"$readyFile") -PassThru
          for ($i=0; $i -lt 100 -and !(Test-Path $readyFile) -and !$live.HasExited; $i++) {
            Start-Sleep -Milliseconds 200
          }
          if (!(Test-Path $readyFile) -or $live.HasExited) {
            throw 'Installed active-Master simulated session did not start.'
          }
          $reinstall = Invoke-BoundedProcess -Path $setup -Arguments $args -Seconds 180
          if ($reinstall.ExitCode -ne 0) { throw "Live-Master reinstall failed: $($reinstall.ExitCode)" }
          if (!$live.WaitForExit(20000)) { throw 'Installer failed to close active Master gracefully.' }
          if ($live.ExitCode -ne 0) { throw "Active Master close exited abnormally: $($live.ExitCode)" }
          if (!(Test-Path $sentinel)) { throw 'Active-Master reinstall deleted user data.' }
          $uninstall = Join-Path $installDir 'unins000.exe'
          if (!(Test-Path $uninstall)) { throw 'Missing registered uninstaller.' }
          $removed = Invoke-BoundedProcess -Path $uninstall -Arguments @('/VERYSILENT','/NORESTART') -Seconds 180
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed: $($removed.ExitCode)" }
          if (Test-Path $exe) { throw 'Uninstall left application executable behind.' }
          if (!(Test-Path $sentinel)) { throw 'Uninstall deleted user data.' }
          Remove-Item $oldSetup -Force
          "Previous released binary v$oldVersion -> current $version; running WPF and active Master demo shutdown; user data preserved." |
            Set-Content (Join-Path $output 'UPGRADE-ACCEPTANCE.txt') -Encoding utf8

      - name: Upload successful installer upgrade acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-installer-upgrade-acceptance
          path: artifacts/installer/UPGRADE-ACCEPTANCE.txt
          if-no-files-found: ignore
          retention-days: 14
