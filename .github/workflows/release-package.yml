name: Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v. Leave empty to read Directory.Build.props.'
        required: false
        default: ''
      publish_release:
        description: 'Create or update GitHub Release after the package is built'
        type: boolean
        required: true
        default: true
      prerelease:
        description: 'Mark the GitHub Release as pre-release'
        type: boolean
        required: true
        default: false
      draft:
        description: 'Create the GitHub Release as draft'
        type: boolean
        required: true
        default: false
      release_notes_file:
        description: 'Release notes markdown file. Leave empty to use CHANGELOG.md or archived release notes.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      draft: ${{ steps.release.outputs.draft }}
      notes_file: ${{ steps.release.outputs.notes_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          repo_version=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('Directory.Build.props').findtext('.//Version') or '')")

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            if [[ -z "$version" ]]; then version="$repo_version"; fi
            publish_release="${{ inputs.publish_release }}"
            prerelease="${{ inputs.prerelease }}"
            draft="${{ inputs.draft }}"
            notes_file="${{ inputs.release_notes_file }}"
          else
            version="${GITHUB_REF_NAME#v}"
            publish_release="true"
            prerelease="false"
            draft="false"
            notes_file="docs/archive/release-notes/RELEASE_NOTES_v${version}.md"
          fi

          if [[ -z "$version" ]]; then
            echo "Release version cannot be empty." >&2
            exit 1
          fi

          if [[ -z "$notes_file" ]]; then
            archive_notes="docs/archive/release-notes/RELEASE_NOTES_v${version}.md"
            if [[ -f "$archive_notes" ]]; then notes_file="$archive_notes"; else notes_file="CHANGELOG.md"; fi
          fi

          tag="v${version}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish_release=$publish_release"
            echo "prerelease=$prerelease"
            echo "draft=$draft"
            echo "notes_file=$notes_file"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release configuration"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | $version |"
            echo "| Tag | $tag |"
            echo "| Publish release | $publish_release |"
            echo "| Pre-release | $prerelease |"
            echo "| Draft | $draft |"
            echo "| User asset | ARIEC60870-v$version-win-x64.zip |"
            echo "| Release notes | $notes_file |"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build, verify, SBOM, and attest package
    needs: resolve
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run full xUnit regression gate
        shell: pwsh
        run: |
          dotnet restore ARIEC60870.sln
          dotnet build ARIEC60870.sln --configuration Release --no-restore -p:Version=${{ needs.resolve.outputs.version }}
          dotnet run --project tests/ARIEC60870.Protocol.Tests/ARIEC60870.Protocol.Tests.csproj --configuration Release --no-build
          dotnet test ARIEC60870.sln --configuration Release --no-build --logger "trx;LogFileName=release-gate.trx" --results-directory artifacts/test-results

      - name: Build user single-file EXE package
        shell: pwsh
        run: ./scripts/publish-windows-portable.ps1 -Version '${{ needs.resolve.outputs.version }}' -SkipTests

      - name: Verify package structure
        shell: pwsh
        run: ./scripts/verify-release-package.ps1 -PackagePath "artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-win-x64.zip"

      - name: Generate SPDX dependency SBOM
        shell: pwsh
        run: ./scripts/generate-sbom-lite.ps1 -Version '${{ needs.resolve.outputs.version }}' -OutputPath "artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-sbom.spdx.json"

      - name: Refresh release checksums
        shell: pwsh
        run: |
          $ReleaseRoot = Resolve-Path artifacts/release
          $files = Get-ChildItem $ReleaseRoot -File | Where-Object { $_.Extension -in '.zip', '.json' } | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file.FullName
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $file.Name
          }
          $lines | Set-Content -Path (Join-Path $ReleaseRoot 'SHA256SUMS.txt') -Encoding ASCII

      - name: Summarize release assets
        shell: pwsh
        run: |
          $ReleaseRoot = Resolve-Path artifacts/release
          Add-Content $env:GITHUB_STEP_SUMMARY '### Release assets'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '| Asset | Size | SHA256 |'
          Add-Content $env:GITHUB_STEP_SUMMARY '|---|---:|---|'
          foreach ($file in (Get-ChildItem $ReleaseRoot -File | Sort-Object Name)) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            $size = '{0:N1} MB' -f ($file.Length / 1MB)
            Add-Content $env:GITHUB_STEP_SUMMARY "| $($file.Name) | $size | ``$hash`` |"
          }

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-win-x64.zip
            artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-sbom.spdx.json
            artifacts/release/SHA256SUMS.txt

      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-v${{ needs.resolve.outputs.version }}-release-test-results
          path: artifacts/test-results/**/*
          if-no-files-found: warn

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-v${{ needs.resolve.outputs.version }}-windows-release
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ resolve, package ]
    if: needs.resolve.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARIEC60870-v${{ needs.resolve.outputs.version }}-windows-release
          path: artifacts/release

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ needs.resolve.outputs.tag }}'
          version='${{ needs.resolve.outputs.version }}'
          notes='${{ needs.resolve.outputs.notes_file }}'
          title="ARIEC60870 $tag"

          if [[ ! -f "$notes" ]]; then notes='CHANGELOG.md'; fi

          flags=()
          if [[ '${{ needs.resolve.outputs.prerelease }}' == 'true' ]]; then flags+=(--prerelease); fi
          if [[ '${{ needs.resolve.outputs.draft }}' == 'true' ]]; then flags+=(--draft); fi

          mapfile -t assets < <(find artifacts/release -maxdepth 1 -type f | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'No release assets found.' >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$title" --notes-file "$notes" --target "$GITHUB_SHA" "${flags[@]}"
          fi

          echo "Published release $tag with ${#assets[@]} assets." >> "$GITHUB_STEP_SUMMARY"
