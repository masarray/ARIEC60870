name: Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v. Leave empty to read Directory.Build.props.'
        required: false
        default: ''
      publish_release:
        description: 'Create or update GitHub Release after the package is built'
        type: boolean
        required: true
        default: true
      prerelease:
        description: 'Mark the GitHub Release as pre-release'
        type: boolean
        required: true
        default: false
      draft:
        description: 'Create the GitHub Release as draft'
        type: boolean
        required: true
        default: false
      release_notes_file:
        description: 'Release notes markdown file. Leave empty to use CHANGELOG.md or archived release notes.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    # Maintainer-only public test release. The version derives from the branch
    # name, and the normal stable release workflow remains unchanged.
    branches:
      - 'release/rc-*'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      draft: ${{ steps.release.outputs.draft }}
      notes_file: ${{ steps.release.outputs.notes_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          repo_version=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('Directory.Build.props').findtext('.//Version') or '')")

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            if [[ -z "$version" ]]; then version="$repo_version"; fi
            publish_release="${{ inputs.publish_release }}"
            prerelease="${{ inputs.prerelease }}"
            draft="${{ inputs.draft }}"
            notes_file="${{ inputs.release_notes_file }}"
          elif [[ "${GITHUB_REF}" == refs/heads/release/rc-* ]]; then
            version="${GITHUB_REF_NAME#release/rc-}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "Refuse non-RC version from release branch: $version" >&2
              exit 1
            fi
            publish_release="true"
            prerelease="true"
            draft="false"
            notes_file="docs/archive/release-notes/RELEASE_NOTES_v${version}.md"
          else
            version="${GITHUB_REF_NAME#v}"
            publish_release="true"
            prerelease="false"
            draft="false"
            notes_file="docs/archive/release-notes/RELEASE_NOTES_v${version}.md"
          fi

          if [[ -z "$version" ]]; then
            echo "Release version cannot be empty." >&2
            exit 1
          fi

          if [[ -z "$notes_file" ]]; then
            archive_notes="docs/archive/release-notes/RELEASE_NOTES_v${version}.md"
            if [[ -f "$archive_notes" ]]; then notes_file="$archive_notes"; else notes_file="CHANGELOG.md"; fi
          fi

          tag="v${version}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish_release=$publish_release"
            echo "prerelease=$prerelease"
            echo "draft=$draft"
            echo "notes_file=$notes_file"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release configuration"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | $version |"
            echo "| Tag | $tag |"
            echo "| Publish release | $publish_release |"
            echo "| Pre-release | $prerelease |"
            echo "| Draft | $draft |"
            echo "| User asset | ARIEC60870-v$version-win-x64.zip |"
            echo "| Release notes | $notes_file |"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build, verify, SBOM, and attest package
    needs: resolve
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp package version metadata
        shell: pwsh
        run: ./scripts/stamp-release-version.ps1 -Version '${{ needs.resolve.outputs.version }}'

      - name: Run full xUnit regression gate
        shell: pwsh
        run: |
          ./scripts/prepare-inter-font.ps1
          dotnet restore ARIEC60870.sln
          dotnet build ARIEC60870.sln --configuration Release --no-restore -p:Version=${{ needs.resolve.outputs.version }} -p:TreatWarningsAsErrors=true
          dotnet run --project tests/ARIEC60870.Protocol.Tests/ARIEC60870.Protocol.Tests.csproj --configuration Release --no-build
          # The solution contains six test projects. A shared TRX filename
          # silently overwrites earlier suites and destroys release evidence.
          # Reuse the CI project's explicit per-assembly execution contract.
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          $projects = @(
            'tests/ARIEC60870.Core.Tests/ARIEC60870.Core.Tests.csproj',
            'tests/ARIEC60870.Master.Tests/ARIEC60870.Master.Tests.csproj',
            'tests/ARIEC60870.Monitor.Tests/ARIEC60870.Monitor.Tests.csproj',
            'tests/ARIEC60870.Reporting.Tests/ARIEC60870.Reporting.Tests.csproj',
            'tests/ARIEC60870.Desktop.Tests/ARIEC60870.Desktop.Tests.csproj',
            'tests/ARIEC60870.Repository.Tests/ARIEC60870.Repository.Tests.csproj'
          )
          foreach ($project in $projects) {
            $name = Split-Path (Split-Path $project -Parent) -Leaf
            dotnet test $project --configuration Release --no-build --logger "trx;LogFileName=release-gate-$name.trx" --results-directory artifacts/test-results
            if ($LASTEXITCODE -ne 0) { throw "Release regression suite $name failed with exit code $LASTEXITCODE." }
          }

      - name: Build user single-file EXE package
        shell: pwsh
        run: ./scripts/publish-windows-portable.ps1 -Version '${{ needs.resolve.outputs.version }}' -SkipTests

      - name: Verify package structure
        shell: pwsh
        run: ./scripts/verify-release-package.ps1 -PackagePath "artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-win-x64.zip"

      # The exact self-contained executable that enters the public ZIP must
      # pass a real Windows WPF probe. In particular, HOLD cannot mutate the
      # visible Frame Trace collection while the canonical source receives.
      # This runs after publish, not against an earlier CI build artifact.
      - name: Verify release executable passive GUI and Frame Trace WPF acceptance
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'artifacts/publish-desktop-win-x64/ARIEC60870.Desktop.exe'
          $output = 'artifacts/release-wpf-evidence'
          if (!(Test-Path $exe)) { throw 'Exact release GUI executable missing.' }
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $smoke = Start-Process -FilePath $exe -ArgumentList '--passive-gui-smoke' -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) { throw "Release GUI smoke failed with exit code $($smoke.ExitCode)." }
          $accept = Start-Process -FilePath $exe -ArgumentList @('--observation-ui-acceptance', '--observation-out', $output) -Wait -PassThru -NoNewWindow
          if ($accept.ExitCode -ne 0) {
            if (Test-Path (Join-Path $output 'failure.txt')) { Get-Content (Join-Path $output 'failure.txt') }
            throw "Release WPF Frame Trace acceptance failed with exit code $($accept.ExitCode)."
          }
          $metricsPath = Join-Path $output 'metrics.json'
          if (!(Test-Path $metricsPath)) { throw 'Missing real-WPF acceptance metrics.' }
          $metrics = Get-Content $metricsPath -Raw | ConvertFrom-Json
          if ($metrics.passed -ne $true -or
              $metrics.frameTraceLoad.HeldCollectionMutations -ne 0 -or
              $metrics.frameTraceLoad.SourceAdvancedWhileHeld -ne $true -or
              $metrics.frameTraceLoad.AutoFollowTailRealized -ne $true -or
              $metrics.frameTraceLoad.NewestFrameObserved -ne $true -or
              $metrics.frameTraceLoad.RollingCollectionResets -ne 0) {
            throw 'Release Frame Trace HOLD/AUTO/source identity invariant failed.'
          }
          if ((Get-ChildItem $output -Filter '*.png').Count -lt 7) {
            throw 'Missing release WPF viewport screenshots.'
          }
          Add-Content $env:GITHUB_STEP_SUMMARY '### Real-WPF release gate'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Exact ZIP executable: GUI smoke + 10,000-frame HOLD/AUTO source/viewport acceptance passed; metrics and screenshot artifact uploaded.'

      - name: Upload release WPF acceptance screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-v${{ needs.resolve.outputs.version }}-wpf-evidence
          path: artifacts/release-wpf-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Compile matching Windows Setup EXE for public RC testers
        if: needs.resolve.outputs.prerelease == 'true'
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler unavailable.' }
          }
          if (!(Test-Path $iscc)) { throw 'Missing Inno Setup compiler.' }
          $source = (Resolve-Path artifacts/publish-desktop-win-x64).Path
          $output = (Resolve-Path artifacts/release).Path
          $version = '${{ needs.resolve.outputs.version }}'
          & $iscc "/DAppVersion=$version" "/DSourceRoot=$source" "/DOutputRoot=$output" installer/ARIEC60870.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setup = Join-Path $output "ARIEC60870-v$version-setup-win-x64.exe"
          if (!(Test-Path $setup)) { throw 'Expected matching RC setup executable missing.' }

      - name: Generate SPDX dependency SBOM
        shell: pwsh
        run: ./scripts/generate-sbom-lite.ps1 -Version '${{ needs.resolve.outputs.version }}' -OutputPath "artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-sbom.spdx.json"

      - name: Refresh release checksums
        shell: pwsh
        run: |
          $ReleaseRoot = Resolve-Path artifacts/release
          $files = Get-ChildItem $ReleaseRoot -File | Where-Object { $_.Extension -in '.zip', '.json', '.exe' } | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file.FullName
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $file.Name
          }
          $lines | Set-Content -Path (Join-Path $ReleaseRoot 'SHA256SUMS.txt') -Encoding ASCII

      - name: Summarize release assets
        shell: pwsh
        run: |
          $ReleaseRoot = Resolve-Path artifacts/release
          Add-Content $env:GITHUB_STEP_SUMMARY '### Release assets'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '| Asset | Size | SHA256 |'
          Add-Content $env:GITHUB_STEP_SUMMARY '|---|---:|---|'
          foreach ($file in (Get-ChildItem $ReleaseRoot -File | Sort-Object Name)) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            $size = '{0:N1} MB' -f ($file.Length / 1MB)
            Add-Content $env:GITHUB_STEP_SUMMARY "| $($file.Name) | $size | ``$hash`` |"
          }

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-win-x64.zip
            artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-sbom.spdx.json
            artifacts/release/SHA256SUMS.txt

      # The original multi-subject attestation intentionally covers portable
      # ZIP, SBOM and checksums. The RC setup EXE must also have provenance.
      # Keep it conditional so stable builds without an installer stay valid.
      - name: Attest RC Windows installer
        if: needs.resolve.outputs.prerelease == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/ARIEC60870-v${{ needs.resolve.outputs.version }}-setup-win-x64.exe

      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-v${{ needs.resolve.outputs.version }}-release-test-results
          path: artifacts/test-results/**/*
          if-no-files-found: warn

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-v${{ needs.resolve.outputs.version }}-windows-release
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ resolve, package ]
    if: needs.resolve.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARIEC60870-v${{ needs.resolve.outputs.version }}-windows-release
          path: artifacts/release

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ needs.resolve.outputs.tag }}'
          version='${{ needs.resolve.outputs.version }}'
          notes='${{ needs.resolve.outputs.notes_file }}'
          title="ARIEC60870 $tag"

          if [[ ! -f "$notes" ]]; then notes='CHANGELOG.md'; fi

          flags=()
          if [[ '${{ needs.resolve.outputs.prerelease }}' == 'true' ]]; then flags+=(--prerelease); fi
          if [[ '${{ needs.resolve.outputs.draft }}' == 'true' ]]; then flags+=(--draft); fi

          mapfile -t assets < <(find artifacts/release -maxdepth 1 -type f | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'No release assets found.' >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$title" --notes-file "$notes" --target "$GITHUB_SHA" "${flags[@]}"
          fi

          echo "Published release $tag with ${#assets[@]} assets." >> "$GITHUB_STEP_SUMMARY"
