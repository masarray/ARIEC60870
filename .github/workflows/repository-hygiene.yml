name: Repository hygiene

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required public repo files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md CHANGELOG.md LICENSE NOTICE THIRD_PARTY_NOTICES.md
            CONTRIBUTING.md SECURITY.md SUPPORT.md CODE_OF_CONDUCT.md
            docs/QUICK_START.md docs/TROUBLESHOOTING.md docs/VALIDATION_MATRIX.md
            site/index.html site/sitemap.xml site/robots.txt site/site.webmanifest
            site/seo-manifest.json site/llms.txt site/humans.txt
            docs/index.html docs/sitemap.xml docs/robots.txt docs/site.webmanifest
            docs/.nojekyll docs/.pages-compatibility-mirror
            .github/PULL_REQUEST_TEMPLATE.md .github/dependabot.yml
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Check version alignment and public wording
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Directory.Build.props Version is empty.' }

          $readme = Get-Content README.md -Raw
          $site = Get-Content site/index.html -Raw
          $manifest = Get-Content site/site.webmanifest -Raw
          if ($site -notmatch [regex]::Escape($version)) { throw "site/index.html does not contain version $version" }
          if ($manifest -notmatch 'IEC 60870') { throw 'site.webmanifest is not IEC 60870 branded.' }
          if ($readme -notmatch 'IEC 60870-5-101' -or $readme -notmatch 'IEC 60870-5-104') { throw 'README does not clearly describe 101/104 coverage.' }

      - name: Check site asset hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ -d landing/screenshot ] || [ -d site/screenshot ]; then
            echo "Raw screenshot folders should not be committed to public site folders."
            exit 1
          fi
          find site/assets -type f -size +750k -print -quit | grep -q . && { echo "Large site asset found; compress before commit."; exit 1; } || true

      - name: Check canonical site ownership and /docs compatibility mirror
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            landing/index.html landing/styles.css landing/script.js landing/sitemap.xml landing/robots.txt
          )
          for file in "${forbidden[@]}"; do
            if [ -e "$file" ]; then
              echo "Legacy landing source is not allowed: $file"
              exit 1
            fi
          done

          runtime=(
            index.html 404.html styles.css script.js robots.txt sitemap.xml site.webmanifest
            seo-manifest.json llms.txt humans.txt download.html faq.html protocol-coverage.html
            quick-start.html troubleshooting.html
          )
          for file in "${runtime[@]}"; do
            test -f "site/$file" || { echo "Missing canonical site file: site/$file"; exit 1; }
            test -f "docs/$file" || { echo "Missing /docs GitHub Pages compatibility file: docs/$file"; exit 1; }
          done
          test -d docs/assets || { echo "Missing docs/assets compatibility mirror."; exit 1; }

          if ! cmp -s site/index.html docs/index.html; then
            echo "::warning::docs/index.html is out of sync with site/index.html. GitHub Pages still deploys canonical site/. Run scripts/sync-github-pages-docs-mirror.ps1 before branch-based /docs publishing."
          fi

      - name: Check sitemap and canonical coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('site/seo-manifest.json').read_text(encoding='utf-8'))
          sitemap = Path('site/sitemap.xml').read_text(encoding='utf-8')
          for page in manifest['pages']:
              html_path = Path('site') / page['path']
              html = html_path.read_text(encoding='utf-8')
              canonical = page['canonical']
              if f'<link rel="canonical" href="{canonical}"' not in html:
                  raise SystemExit(f'Missing canonical in {html_path}: {canonical}')
              if canonical not in sitemap:
                  raise SystemExit(f'Sitemap missing canonical URL: {canonical}')
              if 'og:title' not in html or 'og:description' not in html:
                  raise SystemExit(f'Missing Open Graph metadata: {html_path}')
          PY
