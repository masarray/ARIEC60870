name: CodeQL

on:
  push:
    branches: [ main, master ]
    # CodeQL scans C#; run it when managed code, generated WPF code,
    # build/dependency inputs or CodeQL configuration change.
    paths: &codeql_paths
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.xaml'
      - '**/*.resx'
      - '**/*.props'
      - '**/*.targets'
      - 'ARIEC60870.sln'
      - '.editorconfig'
      - 'global.json'
      - 'NuGet.Config'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ main, master ]
    paths: *codeql_paths
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

# A new PR head supersedes old CodeQL work; do not cancel master/scheduled evidence.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare pinned Inter font
        shell: pwsh
        run: ./scripts/prepare-inter-font.ps1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', '**/packages.lock.json', 'global.json', 'NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build ARIEC60870.sln --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
