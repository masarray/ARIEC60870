name: SICAM Field Build

on:
  # Produce a one-time P0/P1 field-testing artifact when this workflow lands.
  # Subsequent builds can be requested manually without publishing a release.
  push:
    branches: [master]
    paths:
      - '.github/workflows/sicam-field-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sicam-field-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Build and verify field-testing ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact field-build commit
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare field build metadata
        shell: pwsh
        run: |
          ./scripts/stamp-release-version.ps1 -Version '3.6.9-sicam-linkproof.20261027'

      - name: Package Windows x64 single-file application
        shell: pwsh
        run: |
          ./scripts/publish-windows-portable.ps1 -Version '3.6.9-sicam-linkproof.20261027' -SkipTests

      - name: Verify deliverable and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.6.9-sicam-linkproof.20261027'
          $package = "artifacts/release/ARIEC60870-v$version-win-x64.zip"
          if (-not (Test-Path $package)) { throw "Windows ZIP was not produced." }
          ./scripts/verify-release-package.ps1 -PackagePath $package
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          $expected = "$hash  $(Split-Path $package -Leaf)"
          $stored = Get-Content artifacts/release/SHA256SUMS.txt
          if ($stored -notcontains $expected) { throw "Package SHA256SUMS mismatch." }
          $exeInfo = "$(git rev-parse HEAD)"
          @(
            '### SICAM A8000 IEC-101 verified-link and no-data recovery build'
            ''
            "| Source commit | $exeInfo |"
            "| Portable ZIP | $(Split-Path $package -Leaf) |"
            "| SHA-256 | $hash |"
            '| Usage | Extract ZIP, run ARIEC60870.exe, select IEC-101 Serial, then export ProtocolTrace |'
            '| Classification | Engineering/FAT pre-release, **not** an interoperability-certified release |'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload SICAM field-testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARIEC60870-SICAM-LINKPROOF-20261027-win-x64
          path: |
            artifacts/release/ARIEC60870-v3.6.9-sicam-linkproof.20261027-win-x64.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
